name: Build Unity WebGL and Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'   # 打 tag（如 v0.1.0）即自动构建并发布 Release

env:
  BUILD_TARGET: WebGL
  OUT_DIR: build/WebGL

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # game-ci 会按 ProjectSettings/ProjectVersion.txt 自动安装对应 Unity 版本（本项目为 2022.3 LTS）
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build (game-ci)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.BUILD_TARGET }}
          buildName: SanguoTowerDefense
          allowDirtyBuild: true

      - name: Package artifact
        run: |
          cd "${{ env.OUT_DIR }}"
          zip -r ../../sanguo-webgl.zip .
          cd ../..
          ls -lh sanguo-webgl.zip

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: sanguo-webgl
          path: sanguo-webgl.zip

      - name: Create GitHub Release & upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sanguo-webgl.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
